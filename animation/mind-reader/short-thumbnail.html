<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  svg { display: block; width: 720px; height: 1280px; }
</style>
</head>
<body>
<svg id="stage" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg"></svg>
<script src="lib.js"></script>
<script src="scenes.js"></script>
<script>
/* Short-Titelbild File 002 (9:16) – oben "IT TYPES WHAT YOU THINK.", unten "WHAT COULD GO WRONG?"
 * Mitte: Wandbildschirm mit Toms Gedanken, darunter Tom (schwitzt) und ein schockierter Kollege.
 * Gerendert mit: node ../thumb.js mind-reader/short-thumbnail.html <ziel.png> --vertical */
const SW = 1080, SH = 1920;
function thumb() {
  const t = 1.3;
  const screen = (sx, sy, sw) => typed('This meeting could have been an email.', 1, sx - sw / 2 + 30, sy + 60, { size: 44, maxCh: 22 }).replace(/▌/g, '');
  let world = officeRoom(t, { screen, screenX: 1325 }) + officeFloor([MEET.tom, MEET.raj]);
  world += tom(MEET.tom, { look: [0, -4], mouth: 'flat', brows: 'worried', sweat: .35 }, t);
  world += sitter(MEET.raj, { hair: 'ben', hairCol: '#111', skin: '#8d5a3c', shirt: SUN, seed: 5, look: [-12, -10], mouth: 'o', brows: 'up' }, t);
  world += mug(MEET.raj - 120, '#4c6ef5') + officeTable();
  let s = `<g transform="translate(540 990) scale(1.22) translate(-1325 520)">${world}</g>`.replace('translate(-1325 520)', 'translate(-1325 -520)');
  s += `<linearGradient id="top" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#06121c" stop-opacity=".95"/><stop offset="1" stop-color="#06121c" stop-opacity="0"/></linearGradient>
    <rect width="${SW}" height="560" fill="url(#top)"/>
    <linearGradient id="bot" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#06121c" stop-opacity=".95"/><stop offset="1" stop-color="#06121c" stop-opacity="0"/></linearGradient>
    <rect y="${SH - 560}" width="${SW}" height="560" fill="url(#bot)"/>`;
  s += motes(t, '#e6f6ff', 14);
  const hl = (str, y, col, size) => text(str, SW / 2, y, { size, fill: col, glow: col === MINT ? MINT : null, stroke: '#08121b' });
  s += `<g transform="translate(${SW / 2} 90)"><rect x="-150" y="-36" width="300" height="72" rx="14" fill="#08121b" opacity=".85" stroke="${MINT}" stroke-width="4"/>
    ${text('FILE 002', 0, 2, { size: 38, weight: 800, font: 'JetBrains Mono', fill: MINT, ls: 4 })}</g>`;
  s += hl('IT TYPES', 250, '#fff', 170);
  s += hl('WHAT YOU THINK.', 395, '#fff', 104);
  s += hl('WHAT COULD', 1660, MINT, 136);
  s += hl('GO WRONG?', 1810, MINT, 136);
  return s;
}
document.getElementById('stage').innerHTML = `<defs>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="glow" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="glowS" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>` + thumb();
</script>
</body>
</html>
