<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  svg { display: block; width: 1280px; height: 720px; }
</style>
</head>
<body>
<svg id="stage" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"></svg>
<script src="lib.js"></script>
<script src="scenes.js"></script>
<script>
/* Thumbnail File 002 – "HE THOUGHT IT. IT TYPED IT."
 * Rechts: Meeting, Toms Gedanke steht auf dem Wandbildschirm, alle schauen schockiert.
 * Gerendert mit: node ../thumb.js mind-reader/thumbnail.html <ziel.png> */
function thumb() {
  const t = 1.3;
  const st = { bossLook: [6, -12], bossMouth: 'o', bossBrows: 'angry', anaLook: [10, -10], anaMouth: 'o', anaBrows: 'up',
    rajLook: [-12, -10], rajMouth: 'o', rajBrows: 'up', tomLook: [0, -4], tomMouth: 'flat', tomBrows: 'worried', tomSweat: .35 };
  const screen = (sx, sy, sw) => typed('This meeting could have been an email.', 1, sx - sw / 2 + 30, sy + 60, { size: 44, maxCh: 22 }).replace(/▌/g, '');
  let world = officeRoom(t, { screen, screenX: 1325 }) + officeFloor([MEET.tom, MEET.raj]);
  world += tom(MEET.tom, { look: [0, -4], mouth: 'flat', brows: 'worried', sweat: .35 }, t);
  world += sitter(MEET.raj, { hair: 'ben', hairCol: '#111', skin: '#8d5a3c', shirt: SUN, seed: 5, look: [-12, -10], mouth: 'o', brows: 'up' }, t);
  world += mug(MEET.raj - 120, '#4c6ef5') + officeTable();
  let s = `<g transform="${cam(1.15, 908, 560)}">${world}</g>`;
  s += `<linearGradient id="lft" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#06121c" stop-opacity=".94"/><stop offset=".6" stop-color="#06121c" stop-opacity=".6"/><stop offset="1" stop-color="#06121c" stop-opacity="0"/></linearGradient>
    <rect x="0" y="0" width="980" height="1080" fill="url(#lft)"/>`;
  s += motes(t, '#e6f6ff', 18);
  const hl = (str, y, col, size) => text(str, 80, y, { size, anchor: 'start', fill: col, glow: col === MINT ? MINT : null, stroke: '#08121b' });
  s += hl('HE THOUGHT', 340, '#fff', 128);
  s += hl('IT.', 480, '#fff', 128);
  s += hl('IT TYPED IT.', 630, MINT, 128);
  s += `<g transform="translate(80 120)"><rect x="0" y="-38" width="330" height="76" rx="14" fill="#08121b" opacity=".85" stroke="${MINT}" stroke-width="4"/>
    ${text('FILE 002', 165, 2, { size: 40, weight: 800, font: 'JetBrains Mono', fill: MINT, ls: 4 })}</g>`;
  s += `<rect width="${W}" height="${H}" fill="url(#vig)"/>`;
  return s;
}
document.getElementById('stage').innerHTML = `<defs>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="glow" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="glowS" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <radialGradient id="vig" cx=".5" cy=".5" r=".75"><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".5"/></radialGradient>
  </defs>` + thumb();
</script>
</body>
</html>
