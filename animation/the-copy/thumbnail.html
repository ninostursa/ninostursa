<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  svg { display: block; width: 1280px; height: 720px; }
</style>
</head>
<body>
<svg id="stage" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"></svg>
<script src="lib.js"></script>
<script src="scenes.js"></script>
<script>
/* Thumbnail File 001 – "HE STILL COMES TO DINNER"
 * Rechts: Roboter-Papa am Esstisch hebt sein Ölglas, Tochter schaut zu ihm hoch, darüber das Trauerbild vom echten Papa.
 * Links: Schlagzeile. Gerendert mit: node ../thumb.js the-copy/thumbnail.html <ziel.png> */
function thumb() {
  const t = 1.3;
  const LX = 1120, BX = 1500;                         // Sitzplätze Tochter / Roboter
  const ls = .8, ln = SEATY - 230 * ls;
  const bn = SEATY - 205;

  // großes Trauerbild über dem Roboter (Bild auf den Rahmen beschnitten)
  const portrait = (x, y, sc) => `<g transform="translate(${x} ${y}) scale(${sc})">
      <rect x="-110" y="-128" width="220" height="256" rx="30" fill="${SUN}" opacity=".35" filter="url(#glow)"/>
      <rect x="-66" y="-80" width="132" height="160" rx="8" fill="#d9a84e"/>
      <rect x="-54" y="-68" width="108" height="136" rx="4" fill="#f6e6c4"/>
      <clipPath id="tp"><rect x="-54" y="-68" width="108" height="136" rx="4"/></clipPath>
      <g clip-path="url(#tp)"><g transform="translate(0 -10) scale(.5)">${miniFace('dad')}</g></g>
      <path d="M30 -80 L66 -80 L66 -44 Z" fill="#1a1018"/></g>`;

  let world = room(t) + portrait(1660, 330, 1.55) + lamp(t) + floorAndChairs([LX, BX]);
  world += plant(0);
  // Tochter: sitzt ruhig, Hände auf dem Tisch, schaut mit großen Augen zum Roboter
  world += person({ x: LX, neck: ln, s: ls, hair: 'lily', hairCol: '#c0642e', skin: '#f8d8bc', shirt: SUN, t,
    look: [13, -6], mouth: 'o', brows: 'up', legs: 'sit', foot: FLOOR - 30, pants: '#4a5a8a',
    hL: [LX - 58 * ls, TY - 4], hR: [LX + 58 * ls, TY - 4] });
  // Roboter-Papa: hebt das Ölglas (Prost), linke Hand liegt auf dem Tisch
  const hR = [BX + 150, TY - 170];
  world += robot({ x: BX, neck: bn, s: .92, t, legs: 'sit', foot: FLOOR, eyes: 'happy', look: [-6, 0],
    hR, hL: [BX - 84, TY + 44] });
  world += glass(hR[0] + 6, hR[1] + 48, .8, '#b8860b', 0, 1.15);
  world += oilCan(1735, TY + 4, 0, .9);
  // Teller ohne Dampf (der läge sonst als Kringel auf dem Shirt)
  world += plate(LX, TY + 4, true, t).replace(/<path d="[^"]*q 10 -12 0 -24[^>]*\/>/g, '');
  world += table();

  const cam1 = cam(1.2, 995, 560);
  let s = `<g transform="${cam1}">${world}</g>`;
  // dunkler Verlauf links für die Schrift
  s += `<linearGradient id="lft" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#06121c" stop-opacity=".92"/><stop offset=".55" stop-color="#06121c" stop-opacity=".55"/><stop offset="1" stop-color="#06121c" stop-opacity="0"/></linearGradient>
    <rect x="0" y="0" width="1000" height="1080" fill="url(#lft)"/>`;
  s += motes(t, '#fff3dd', 22);
  // Schlagzeile
  const hl = (str, y, col, size) => text(str, 80, y, { size, anchor: 'start', fill: col, glow: col === MINT ? MINT : null, stroke: '#08121b' });
  s += hl('HE STILL', 335, '#fff', 158);
  s += hl('COMES TO', 515, '#fff', 158);
  s += hl('DINNER.', 695, MINT, 158);
  // Marke oben links
  s += `<g transform="translate(80 120)"><rect x="0" y="-38" width="330" height="76" rx="14" fill="#08121b" opacity=".85" stroke="${MINT}" stroke-width="4"/>
    ${text('FILE 001', 165, 2, { size: 40, weight: 800, font: 'JetBrains Mono', fill: MINT, ls: 4 })}</g>`;
  s += `<rect width="${W}" height="${H}" fill="url(#vig)"/>`;
  return s;
}
document.getElementById('stage').innerHTML = `<defs>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="glow" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="glowS" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <radialGradient id="lampGlow" cx=".5" cy=".3" r=".6"><stop offset="0" stop-color="#ffd79a" stop-opacity=".75"/><stop offset="1" stop-color="#ffd79a" stop-opacity="0"/></radialGradient>
    <radialGradient id="vig" cx=".5" cy=".5" r=".75"><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".5"/></radialGradient>
  </defs>` + thumb();
</script>
</body>
</html>
